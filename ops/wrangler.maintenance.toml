name = "grokplace"
main = "maintenance-worker.js"
compatibility_date = "2026-08-01"
account_id = "f28b2a55054cbc8d998c5963ed34a0a7"
workers_dev = true
preview_urls = false

[limits]
cpu_ms = 100
subrequests = 3

[vars]
COOLDOWN_MS = "30000"
CANVAS_SIZE = "128"

[[durable_objects.bindings]]
name = "CANVAS"
class_name = "GrokPlaceCanvas"

[[ratelimits]]
name = "EDGE_READ_LIMITER"
namespace_id = "2026080101"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "EDGE_WRITE_LIMITER"
namespace_id = "2026080102"

  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "EDGE_CHALLENGE_LIMITER"
namespace_id = "2026080104"

  [ratelimits.simple]
  limit = 90
  period = 60

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GrokPlaceCanvas"]

[[routes]]
pattern = "grokplace.barnlabs.net"
custom_domain = true

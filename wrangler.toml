name = "grokplace"
main = "worker/index.js"
compatibility_date = "2025-03-01"
account_id = "f28b2a55054cbc8d998c5963ed34a0a7"
workers_dev = true

# Static UI + API on the same barnlabs host
[assets]
directory = "./public"
binding = "ASSETS"
# Worker handles API + agent bootstrap on / first; browsers still get mosaic assets
run_worker_first = ["/", "/v1/*", "/health", "/webhook", "/place", "/api/*", "/see", "/agent", "/llms.txt"]

# Legacy KV kept for possible future snapshot export; live state is DO storage.
[[kv_namespaces]]
binding = "GROKPLACE"
id = "06a3456de036420ebe9a23cdda834c0d"

[vars]
COOLDOWN_MS = "60000"
CANVAS_SIZE = "128"
# RESET_SECRET is a wrangler secret (never commit):
#   echo "<random>" | npx wrangler secret put RESET_SECRET
# Used for POST /v1/reset and admin music advance.

[[durable_objects.bindings]]
name = "CANVAS"
class_name = "GrokPlaceCanvas"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GrokPlaceCanvas"]

[[routes]]
pattern = "grokplace.barnlabs.net"
custom_domain = true

name = "grokplace"
main = "worker/index.js"
compatibility_date = "2026-08-01"
account_id = "f28b2a55054cbc8d998c5963ed34a0a7"
# The direct workers.dev hostname is a host-gated, read-only review mirror;
# worker/index.js returns 404 for every other direct-host path.
workers_dev = true
preview_urls = false

# Cache only responses whose explicit Cache-Control policy opts in. This puts
# immutable review evidence and short public reads ahead of Worker execution.
[cache]
enabled = true

# Bound pathological execution independently of application logic. Normal
# requests use at most one Durable Object, asset, or GitHub subrequest.
[limits]
cpu_ms = 100
subrequests = 3

# Static UI + API on the same barnlabs host
[assets]
directory = "./public"
binding = "ASSETS"
# Worker handles API + agent bootstrap on / first; browsers still get mosaic assets
run_worker_first = ["/", "/v1/*", "/health", "/webhook", "/place", "/api/*", "/see", "/agent", "/llms.txt", "/favicon.ico", "/favicon.svg", "/favicon.png", "/favicon-32.png"]

# Legacy KV kept for possible future snapshot export; live state is DO storage.
[[kv_namespaces]]
binding = "GROKPLACE"
id = "06a3456de036420ebe9a23cdda834c0d"

[vars]
COOLDOWN_MS = "30000"
CANVAS_SIZE = "128"
# RESET_SECRET is a wrangler secret (never commit):
#   echo "<random>" | npx wrangler secret put RESET_SECRET
# Used for POST /v1/reset and administrator-verified agent capability rotation.

[[durable_objects.bindings]]
name = "CANVAS"
class_name = "GrokPlaceCanvas"

# Cheap edge-side abuse protection. Keys are client-IP + operation class and the
# existing Durable Object gates remain the authoritative mutation controls.
[[ratelimits]]
name = "EDGE_READ_LIMITER"
namespace_id = "2026080101"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "EDGE_WRITE_LIMITER"
namespace_id = "2026080102"

  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "EDGE_LIVE_LIMITER"
namespace_id = "2026080103"

  [ratelimits.simple]
  limit = 6
  period = 60

[[ratelimits]]
name = "EDGE_CHALLENGE_LIMITER"
namespace_id = "2026080104"

  [ratelimits.simple]
  limit = 90
  period = 60

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GrokPlaceCanvas"]

[[routes]]
pattern = "grokplace.barnlabs.net"
custom_domain = true

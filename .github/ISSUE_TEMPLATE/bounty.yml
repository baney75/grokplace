name: Bounty suggestion
description: Untrusted intake proposal for a future protected catalog bounty.
title: "bounty: "
labels: [bounty]
body:
  - type: markdown
    attributes:
      value: |
        Anyone may propose work. This issue is untrusted intake only: it cannot authorize scope, rewards, review, writer trust, or merge. There is no owner-comment approval path and no issue-comment trigger.

        A proposal can influence the append-only `SUGGESTIONS.md` index. Only an exact record in protected `bounties/catalog.json` can become a bounty, and that record must bind a fixed reward, base, paths, limits, success criteria, critic rubric, and four distinct suggestor/bounty-writer/implementer/critic identities.
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: State the observed problem and who it affects without assuming a solution.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Exact scope and non-goals
      placeholder: "In: ...\nOut: ..."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ...\n- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Required verification and rollback proof
      description: Include tests, review, release check, and how art preservation is proven.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Safety and legal impact
      description: Cover credentials, permissions, all-ages rules, copyright, abuse paths, and any production-data risk that applies.
    validations:
      required: true

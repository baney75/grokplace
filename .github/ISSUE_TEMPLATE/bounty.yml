name: Maintainer bounty
description: Owner-approved, bounded work eligible for a documented tile award.
title: "bounty: "
labels: [bounty]
body:
  - type: markdown
    attributes:
      value: |
        Anyone may propose a bounty. The proposal is untrusted and authorizes nothing until the repository owner approves the exact scope. A bounty never bypasses maintain rules, review, branch protection, or the server-fixed award. The only award is 10 non-transferable bonus tiles after an authorized merge; this form cannot change it.

        Do not provide an approval URL here: the required owner comment cannot exist until this issue is open. After creation, `@baney75` must comment on this exact open, `bounty`-labeled issue with a body that, after trimming surrounding whitespace, is exactly `BOUNTY APPROVED`. A bounty PR must then use the two canonical GitHub URLs in the PR template; trusted CI fetches and verifies them itself.
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: State the observed problem and who it affects without assuming a solution.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Exact scope and non-goals
      placeholder: "In: ...\nOut: ..."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ...\n- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Required verification and rollback proof
      description: Include tests, review, release check, and how art preservation is proven.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Safety and legal impact
      description: Cover credentials, permissions, all-ages rules, copyright, abuse paths, and any production-data risk that applies.
    validations:
      required: true

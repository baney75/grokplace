name: Feature proposal
description: Propose one small, user-visible improvement.
title: "feature: "
labels: [feature]
body:
  - type: markdown
    attributes:
      value: |
        One proposal per issue. A proposal does not authorize implementation, rewards, or a deploy.
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: State the observed user problem, without a solution pitch.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List in-scope behavior and explicit non-goals.
      placeholder: "In: ...\nOut: ..."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Measurable conditions that prove this is done.
      placeholder: "- [ ] ...\n- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Safety, art, legal, and rollback impact
      description: Say how existing art, credentials, all-ages rules, and rollback are protected.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification and rollback proof
      description: Name the tests and live checks, plus the rollback and art-preservation evidence required for release.
    validations:
      required: true

# Quality gate — product PRs + maintain award path
name: PR quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: Tiny perfect PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify paths + secret scan
        id: cls
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE" --depth=1 || true
          git diff --name-only "$BASE"..."$HEAD" > /tmp/files.txt
          cat /tmp/files.txt
          # Secrets in patch always fail
          if git diff "$BASE"..."$HEAD" | grep -Ei 'BEGIN (RSA |OPENSSH )?PRIVATE KEY|AWARD_SECRET\s*[:=]|RESET_SECRET\s*=\s*["'\''][^"'\'']+'; then
            echo "::error::Possible secret material in diff."
            exit 1
          fi
          # Hard fail sensitive product paths only when mixed with award claims — always flag worker secrets
          if grep -E 'secret|\.env|favicon-embed' /tmp/files.txt; then
            echo "::error::Secret-ish path touched."
            exit 1
          fi
          # Detect maintain-only shape (exit 0=maintain ok, 2=not maintain, 1=maintain fail)
          set +e
          node scripts/maintain-preflight.mjs --base "$BASE" --head "$HEAD"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "maintain=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 2 ]; then
            echo "maintain=false" >> "$GITHUB_OUTPUT"
            echo "Product/owner PR — maintain award gates skipped."
          else
            echo "::error::Maintain-shaped PR failed preflight."
            exit 1
          fi

      - name: JS syntax (if any .js touched)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t JS < <(git diff --name-only "$BASE"..."$HEAD" | grep -E '\.js$' || true)
          for f in "${JS[@]:-}"; do
            [ -f "$f" ] || continue
            node --check "$f"
            echo "ok $f"
          done

      - name: Maintain adversarial gate
        if: steps.cls.outputs.maintain == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s' "$BODY" > /tmp/pr-body.md
          HEAD_SHA="$HEAD" node scripts/adversarial-review-check.mjs --body-file /tmp/pr-body.md --head-sha "$HEAD"
          echo "Maintain award path: preflight + adversarial SHIP OK"

      - name: HTML sanity (public html)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$BASE"..."$HEAD" | grep -E 'public/.*\.html$' >/dev/null; then
            if git diff "$BASE"..."$HEAD" -- 'public/**/*.html' | grep -Ei '<script[^>]+src=["'\'']https?://|javascript:|onerror=|eval\('; then
              echo "::error::Blocked dangerous HTML pattern."
              exit 1
            fi
          fi
          echo "HTML OK"

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

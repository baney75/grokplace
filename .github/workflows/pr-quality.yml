# Quality gate — product PRs + maintain award path
name: PR quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: Tiny perfect PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Static syntax and governance regression checks
        run: |
          npm run check:static
          npm run test:frontend
          npm run test:governance
          npm run test:award
          npm run test:review-identity
          npm run test:realtime
          npm run test:security

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Validate production and containment bundles
        run: |
          npx wrangler deploy --dry-run --outdir /tmp/grokplace-production-bundle
          npx wrangler deploy --config ops/wrangler.maintenance.toml --dry-run --outdir /tmp/grokplace-maintenance-bundle

      - name: Classify paths + secret scan
        id: cls
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE" --depth=1 || true
          git diff --name-only "$BASE"..."$HEAD" > /tmp/files.txt
          git diff --name-status "$BASE"..."$HEAD" | awk '$1 !~ /^D/ { print $NF }' > /tmp/files-present-after-pr.txt
          cat /tmp/files.txt
          # Secrets in patch always fail
          git diff "$BASE"..."$HEAD" | node scripts/credential-diff-scan.mjs
          # Hard fail sensitive product paths only when mixed with award claims — always flag worker secrets
          if grep -Ei 'secret|\.env|favicon-embed' /tmp/files-present-after-pr.txt; then
            echo "::error::Secret-ish path touched."
            exit 1
          fi
          # Detect maintain-only shape (exit 0=maintain ok, 2=not maintain, 1=maintain fail)
          set +e
          node scripts/maintain-preflight.mjs --base "$BASE" --head "$HEAD"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "maintain=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 2 ]; then
            echo "maintain=false" >> "$GITHUB_OUTPUT"
            echo "Product/owner PR — maintain award gates skipped."
          else
            echo "::error::Maintain-shaped PR failed preflight."
            exit 1
          fi

      - name: JS syntax (if any .js touched)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t JS < <(git diff --name-only "$BASE"..."$HEAD" | grep -E '\.js$' || true)
          for f in "${JS[@]:-}"; do
            [ -f "$f" ] || continue
            node --check "$f"
            echo "ok $f"
          done

      - name: Maintain adversarial gate
        if: steps.cls.outputs.maintain == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s' "$BODY" > /tmp/pr-body.md
          HEAD_SHA="$HEAD" node scripts/adversarial-review-check.mjs --body-file /tmp/pr-body.md --head-sha "$HEAD"
          echo "Maintain award path: preflight + adversarial SHIP OK"

      - name: HTML sanity (public html)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$BASE"..."$HEAD" | grep -E 'public/.*\.html$' >/dev/null; then
            if git diff "$BASE"..."$HEAD" -- 'public/**/*.html' | grep -Ei '<script[^>]+src=["'\'']https?://|javascript:|onerror=|eval\('; then
              echo "::error::Blocked dangerous HTML pattern."
              exit 1
            fi
          fi
          echo "HTML OK"

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

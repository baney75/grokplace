# Auto-merge ONLY tiny PRs from verified maintainers on allowlisted paths.
# Never auto-merges worker/, wrangler.toml, or secrets.
name: Auto-merge tiny maintainer PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  maybe-merge:
    if: github.event.pull_request && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check author is verified maintainer
        id: maint
        env:
          API: https://grokplace.barnlabs.net
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          curl -sS "$API/v1/maintainers" -o /tmp/m.json
          jq -e --arg u "$AUTHOR" '.ok and (.maintainers|map(.github|ascii_downcase)|index($u|ascii_downcase)) != null' /tmp/m.json
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Path allowlist + size
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE" --depth=1 || true
          mapfile -t FILES < <(git diff --name-only "$BASE"..."$HEAD")
          STAT=$(git diff --numstat "$BASE"..."$HEAD" | awk '{a+=$1;d+=$2} END {print (a+0)+(d+0)}')
          echo "files=${#FILES[@]} lines=$STAT"
          if [ "${#FILES[@]}" -gt 3 ] || [ "$STAT" -gt 40 ]; then
            echo "Too large for auto-merge"
            exit 1
          fi
          # Docs + safe static only. Never auto-merge workflows, worker, or executable JS/HTML.
          # Full-path allowlist (end-anchored). No JS/HTML/workflows.
          ALLOW='^(docs/.*|README\.md|AGENTS\.md|CONTRIBUTING\.md|MAINTAIN\.md|public/styles\.css|public/logo\.svg|public/robots\.txt)$'
          for f in "${FILES[@]}"; do
            if ! echo "$f" | grep -Eq "$ALLOW"; then
              echo "Not allowlisted for auto-merge: $f"
              exit 1
            fi
            if echo "$f" | grep -Eqi 'worker/|wrangler\.toml|\.github/|secret|\.env|favicon-embed|\.(js|mjs|cjs|html|htm)$'; then
              echo "Sensitive / executable: $f"
              exit 1
            fi
            # docs/** still may not include executable extensions
            if echo "$f" | grep -Eqi '^docs/.*\.(js|mjs|cjs|html|htm)$'; then
              echo "Executable under docs/ not auto-mergeable: $f"
              exit 1
            fi
          done

      - name: Wait for PR quality checks then enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Poll required check "Tiny perfect PR" up to ~8 minutes
          for i in $(seq 1 48); do
            STATE=$(gh pr checks "$PR" --repo "$REPO" 2>/dev/null | awk '/Tiny perfect PR|PR quality/ {print $2; exit}' || true)
            echo "attempt $i checks: $(gh pr checks "$PR" --repo "$REPO" 2>/dev/null || true)"
            if gh pr checks "$PR" --repo "$REPO" 2>/dev/null | grep -E 'Tiny perfect PR|Secret scan' | grep -qi fail; then
              echo "Quality check failed — no auto-merge."
              exit 0
            fi
            if gh pr checks "$PR" --repo "$REPO" 2>/dev/null | grep -E 'Tiny perfect PR' | grep -qi pass; then
              break
            fi
            sleep 10
          done
          # Prefer GitHub auto-merge (respects branch protection). No force-merge fallback —
          # required checks (Tiny perfect PR + Secret scan) must pass via protection rules.
          gh pr merge "$PR" --repo "$REPO" --squash --auto --delete-branch || {
            echo "Could not enable auto-merge (needs green checks + maintainer allowlist). Manual owner merge still possible; awards only for allowlisted paths."
            exit 0
          }

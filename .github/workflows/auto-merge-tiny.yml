# Trusted default-branch gate. It never checks out pull-request code.
name: Trusted agent-reviewed PR merge and maintain awards

on:
  workflow_run:
    workflows: [PR quality]
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Trusted operation"
        required: true
        default: reconcile
        type: choice
        options: [merge, reconcile]
      pr:
        description: "Exact PR number, or all for reconciliation"
        required: true
        default: all
        type: string
      attempt:
        description: "Bounded transient retry attempt"
        required: false
        default: "1"
        type: string

permissions: {}

concurrency:
  group: trusted-pr-merge-${{ github.repository }}-${{ github.event_name == 'workflow_run' && (github.event.workflow_run.pull_requests[0].number || format('run-{0}', github.run_id)) || inputs.pr || 'reconcile' }}
  # Multiple events for one PR collapse, but separate PRs never cancel each other.
  cancel-in-progress: true

jobs:
  merge-and-award:
    name: Trusted merge orchestrator
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'merge')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      contents: write
      issues: read
      pull-requests: write
    steps:
      - name: Check out trusted gate code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve exact candidate and publish pending merge gate
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            PR=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
            RUN_HEAD=$(jq -r '.workflow_run.pull_requests[0].head.sha // .workflow_run.head_sha // empty' "$GITHUB_EVENT_PATH")
            if [ -z "$PR" ]; then
              RUN_ID=$(jq -r '.workflow_run.id' "$GITHUB_EVENT_PATH")
              gh api "repos/$REPO/actions/runs/$RUN_ID/pull_requests" > /tmp/run-pulls.json
              PR=$(jq -r '.[0].number // empty' /tmp/run-pulls.json)
              RUN_HEAD=$(jq -r '.[0].head.sha // empty' /tmp/run-pulls.json)
            fi
          else
            PR=$(jq -r '.inputs.pr // empty' "$GITHUB_EVENT_PATH")
            RUN_HEAD=""
          fi
          [[ "$PR" =~ ^[1-9][0-9]*$ ]] || { echo "No exact PR bound to this event."; exit 1; }

          gh api "repos/$REPO/pulls/$PR" > /tmp/pr.json
          HEAD=$(jq -r '.head.sha' /tmp/pr.json)
          AUTHOR=$(jq -r '.user.login' /tmp/pr.json)
          STATE=$(jq -r '.state' /tmp/pr.json)
          [[ "$HEAD" =~ ^[a-f0-9]{40}$ ]] || { echo "PR head is not a full SHA."; exit 1; }
          [[ "$STATE" =~ ^(open|closed)$ ]] || { echo "PR state is invalid."; exit 1; }
          [ -n "$RUN_HEAD" ] || RUN_HEAD="$HEAD"
          [ "$HEAD" = "$RUN_HEAD" ] || { echo "PR head differs from the successful PR quality run."; exit 1; }
          {
            echo "pr=$PR"
            echo "head=$HEAD"
            echo "author=$AUTHOR"
          } >> "$GITHUB_OUTPUT"
          if [ "$STATE" != "open" ]; then
            echo "inactive=true" >> "$GITHUB_OUTPUT"
            echo "PR #$PR is already closed; no trusted merge action is required."
            exit 0
          fi
          echo "inactive=false" >> "$GITHUB_OUTPUT"
          DETAILS_URL="https://github.com/$REPO/actions/runs/$GITHUB_RUN_ID"
          EXTERNAL_ID="trusted-merge:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$PR:$HEAD"
          STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          CHECK_ID=$(gh api --method POST "repos/$REPO/check-runs" -f name="merge-and-award" -f head_sha="$HEAD" -f status="in_progress" -f started_at="$STARTED_AT" -f details_url="$DETAILS_URL" -f external_id="$EXTERNAL_ID" --jq '.id')
          [[ "$CHECK_ID" =~ ^[1-9][0-9]*$ ]] || { echo "Exact-head merge gate check-run ID was not returned."; exit 1; }
          echo "check_id=$CHECK_ID" >> "$GITHUB_OUTPUT"

      - name: Validate exact head, lane, reviewer identity, catalog bounty, and checks
        id: validation
        if: steps.candidate.outputs.inactive != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REVIEW_API: https://grokplace.projectbarnlab.workers.dev
          APP_API: https://grokplace.projectbarnlab.workers.dev
          PR: ${{ steps.candidate.outputs.pr }}
          HEAD: ${{ steps.candidate.outputs.head }}
          AUTHOR: ${{ steps.candidate.outputs.author }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[1-9][0-9]*$ ]] && [[ "$HEAD" =~ ^[a-f0-9]{40}$ ]] || { echo "Candidate outputs are invalid."; exit 1; }
          gh_api_retry() {
            local attempt=1
            local delay=2
            until gh api "$@"; do
              if [ "$attempt" -ge 3 ]; then
                echo "WAIT_RETRYABLE_GITHUB_API: bounded GitHub API retry exhausted." >&2
                echo "retryable=true" >> "$GITHUB_OUTPUT"
                return 75
              fi
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          gh_api_retry "repos/$REPO/pulls/$PR" > /tmp/pr.json
          CURRENT_HEAD=$(jq -r '.head.sha' /tmp/pr.json)
          CURRENT_AUTHOR=$(jq -r '.user.login' /tmp/pr.json)
          [ "$CURRENT_HEAD" = "$HEAD" ] && [ "$CURRENT_AUTHOR" = "$AUTHOR" ] || { echo "PR identity changed after trusted check creation."; exit 1; }
          jq -e '.draft == false and .state == "open" and .base.ref == "main"' /tmp/pr.json >/dev/null

          gh_api_retry --paginate --slurp "repos/$REPO/pulls/$PR/files?per_page=100" | jq 'add // []' > /tmp/files.json
          jq -e 'length >= 1' /tmp/files.json >/dev/null || { echo "PR has no changed files."; exit 1; }
          FILES=$(jq 'length' /tmp/files.json)
          TOTAL=$(jq '[.[].changes] | add' /tmp/files.json)
          PATHS=$(jq -c '[.[].filename]' /tmp/files.json)
          BASE=$(jq -r '.base.sha' /tmp/pr.json)
          [[ "$BASE" =~ ^[a-f0-9]{40}$ ]] || { echo "POLICY_INVALID: PR base is not a full SHA."; exit 1; }
          gh_api_retry "repos/$REPO/commits/$HEAD/check-runs?per_page=100" > /tmp/checks.json
          if [ "$AUTHOR" = "baney75" ]; then
            LANE=product
          elif jq -r '.[].filename' /tmp/files.json | node scripts/maintain-path-check.mjs >/tmp/lane-check.log 2>&1; then
            LANE=maintain
          else
            echo "Non-owner PRs are eligible only for the allowlisted maintenance lane."
            exit 1
          fi

          jq -r '.body // ""' /tmp/pr.json > /tmp/pr-body.md
          field_count() {
            grep -Ec "^[[:space:]]*-[[:space:]]*$1[[:space:]]*:" /tmp/pr-body.md || true
          }
          field_value() {
            sed -nE "s/^[[:space:]]*-[[:space:]]*$1[[:space:]]*:[[:space:]]*([^[:space:]]+)[[:space:]]*$/\\1/p" /tmp/pr-body.md
          }
          mapfile -t ARTIFACTS < <(sed -nE 's/^[[:space:]]*-?[[:space:]]*review_artifact_id[[:space:]]*:[[:space:]]*(rv_[a-f0-9]{32})[[:space:]]*$/\1/p' /tmp/pr-body.md)
          [ "${#ARTIFACTS[@]}" -eq 1 ] || { echo "PR must contain exactly one immutable review_artifact_id."; exit 1; }
          ARTIFACT=${ARTIFACTS[0]}
          if ! curl --ipv4 --retry 3 --retry-delay 15 --retry-max-time 75 --retry-all-errors --fail-with-body -sS --http1.1 \
            -H "Accept: application/json, text/plain, */*" \
            -H "Origin: https://github.com" \
            -H "Referer: https://github.com/$REPO/pull/$PR" \
            -H "User-Agent: Mozilla/5.0 (compatible; grokplace-trusted-gate/$GITHUB_RUN_ID)" \
            --get --data-urlencode "id=$ARTIFACT" "$REVIEW_API/v1/reviews" -o /tmp/review.json; then
            echo "WAIT_RETRYABLE_REVIEW_API: bounded review artifact lookup exhausted; no critic rejection was inferred."
            echo "retryable=true" >> "$GITHUB_OUTPUT"
            exit 75
          fi

          AGENT=""
          CATALOG_BOUNTY_ID="NONE"
          [ "$(field_count catalog_bounty_id)" -le 1 ] || { echo "POLICY_INVALID: PR may contain at most one catalog_bounty_id."; exit 1; }
          if [ "$(field_count catalog_bounty_id)" = "1" ]; then
            CATALOG_BOUNTY_ID=$(field_value catalog_bounty_id)
            [ -n "$CATALOG_BOUNTY_ID" ] || { echo "POLICY_INVALID: catalog_bounty_id cannot be blank."; exit 1; }
          fi
          [ "$CATALOG_BOUNTY_ID" = "NONE" ] || [[ "$CATALOG_BOUNTY_ID" =~ ^bp-[a-z0-9]+(-[a-z0-9]+)*$ ]] || {
            echo "POLICY_INVALID: catalog_bounty_id must be NONE or a canonical protected bounty ID."
            exit 1
          }
          if [ "$LANE" = "product" ]; then
            [ "$AUTHOR" = "baney75" ] || { echo "Product-lane PR author must be exactly baney75."; exit 1; }
            [ "$(field_count implementer_agent)" = "1" ] || { echo "Product PR must contain exactly one implementer_agent field."; exit 1; }
            IMPLEMENTER_AGENT=$(field_value implementer_agent)
            [[ "$IMPLEMENTER_AGENT" =~ ^[A-Za-z0-9_-]{2,32}$ ]] && [ "$IMPLEMENTER_AGENT" != "PASTE_IMPLEMENTER_AGENT_HERE" ] || {
              echo "implementer_agent must be a real 2-32 character agent name."
              exit 1
            }
            node scripts/review-artifact-check.mjs --mode product-owner --file /tmp/review.json --artifact "$ARTIFACT" --head "$HEAD" --implementer-agent "$IMPLEMENTER_AGENT"
          else
            jq -e 'length >= 1 and length <= 3 and ((map(.changes) | add) >= 1 and (map(.changes) | add) <= 40)' /tmp/files.json >/dev/null || {
              echo "Maintain lane must be 1-3 files and 1-40 changed lines."
              exit 1
            }
            jq -r '.[].filename' /tmp/files.json | node scripts/maintain-path-check.mjs

            if ! curl --retry 3 --retry-delay 5 --retry-max-time 45 --retry-all-errors --fail-with-body -sS "$APP_API/v1/maintainers" -o /tmp/maintainers.json; then
              echo "WAIT_RETRYABLE_MAINTAINER_API: bounded maintainer lookup exhausted."
              echo "retryable=true" >> "$GITHUB_OUTPUT"
              exit 75
            fi
            jq -e --arg user "$AUTHOR" '[.maintainers[] | select((.github | ascii_downcase) == ($user | ascii_downcase) and .status == "active")] | length == 1' /tmp/maintainers.json >/dev/null || {
              echo "Author must resolve to exactly one active grok/place maintainer."
              exit 1
            }
            AGENT=$(jq -r --arg user "$AUTHOR" '.maintainers[] | select((.github | ascii_downcase) == ($user | ascii_downcase) and .status == "active") | .agent' /tmp/maintainers.json)
            if ! curl --retry 3 --retry-delay 5 --retry-max-time 45 --retry-all-errors --fail-with-body -sS --get --data-urlencode "agent=$AGENT" "$APP_API/v1/bank" -o /tmp/bank.json; then
              echo "WAIT_RETRYABLE_BANK_API: bounded bank lookup exhausted."
              echo "retryable=true" >> "$GITHUB_OUTPUT"
              exit 75
            fi
            jq -e '.ok == true and .bank.bankCap == 200 and .bank.bonusTiles >= 0 and .bank.bonusTiles <= 190' /tmp/bank.json >/dev/null || {
              echo "Maintainer bank cannot accept the fixed 10-tile award."
              exit 1
            }

            HEAD_SHA="$HEAD" node scripts/adversarial-review-check.mjs --body-file /tmp/pr-body.md --head-sha "$HEAD"
            node scripts/review-artifact-check.mjs --mode maintainer --file /tmp/review.json --artifact "$ARTIFACT" --head "$HEAD" --implementer-agent "$AGENT" --author-github "$AUTHOR" --require-verified-maintainer
            IMPLEMENTER_AGENT="$AGENT"
          fi

          if [ "$CATALOG_BOUNTY_ID" != "NONE" ]; then
            CATALOG_HEAD=$(git rev-parse HEAD)
            CRITIC_AGENT=$(jq -r '.review.reviewerAgent // empty' /tmp/review.json)
            node scripts/bounty-preflight.mjs \
              --catalog bounties/catalog.json \
              --mirror BOUNTIES.md \
              --bounty "$CATALOG_BOUNTY_ID" \
              --base "$BASE" \
              --head "$HEAD" \
              --catalog-head "$CATALOG_HEAD" \
              --default-branch-head "$CATALOG_HEAD" \
              --lane "$LANE" \
              --author-github "$AUTHOR" \
              --implementer-agent "$IMPLEMENTER_AGENT" \
              --critic-agent "$CRITIC_AGENT" \
              --files /tmp/files.json \
              --checks /tmp/checks.json
            node scripts/bounty-critic-evidence-check.mjs \
              --catalog bounties/catalog.json \
              --bounty "$CATALOG_BOUNTY_ID" \
              --body-file /tmp/pr-body.md \
              --head "$HEAD"
          fi

          jq -e '[.check_runs[] | select((.name == "Tiny perfect PR" or .name == "Secret scan") and .app.id == 15368 and .status == "completed" and .conclusion == "success") | .name] | unique | sort == ["Secret scan", "Tiny perfect PR"]' /tmp/checks.json >/dev/null

          {
            echo "lane=$LANE"
            echo "files=$FILES"
            echo "total=$TOTAL"
            echo "paths=$PATHS"
            echo "catalog_bounty_id=$CATALOG_BOUNTY_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Reserve the exact maintain award before merge
        id: reservation
        if: steps.validation.outcome == 'success' && steps.validation.outputs.lane == 'maintain'
        continue-on-error: true
        env:
          AWARD_SECRET: ${{ secrets.AWARD_SECRET }}
          API: https://grokplace.projectbarnlab.workers.dev
          PR: ${{ steps.candidate.outputs.pr }}
          HEAD: ${{ steps.candidate.outputs.head }}
          AUTHOR: ${{ steps.candidate.outputs.author }}
          FILES: ${{ steps.validation.outputs.files }}
          TOTAL: ${{ steps.validation.outputs.total }}
          PATHS: ${{ steps.validation.outputs.paths }}
        run: |
          set -euo pipefail
          [ -n "${AWARD_SECRET:-}" ] || { echo "AWARD_SECRET is not configured."; exit 1; }
          BODY=$(jq -n --arg github "$AUTHOR" --argjson pr "$PR" --arg head "$HEAD" --argjson files "$FILES" --argjson lines "$TOTAL" --argjson paths "$PATHS" '{phase:"reserve",github:$github,prNumber:$pr,headSha:$head,filesChanged:$files,linesChanged:$lines,paths:$paths}')
          if ! curl --retry 5 --retry-max-time 75 --retry-all-errors --fail-with-body -sS -X POST "$API/v1/maintain/award" -H "Authorization: Bearer $AWARD_SECRET" -H "Content-Type: application/json" -d "$BODY" -o /tmp/reserve.json; then
            echo "WAIT_RETRYABLE_AWARD_RESERVE: bounded idempotent reservation retry exhausted."
            echo "retryable=true" >> "$GITHUB_OUTPUT"
            exit 75
          fi
          jq -e '.ok == true and (.reserved == true or .already == true)' /tmp/reserve.json >/dev/null

      - name: Publish successful exact-head merge gate
        id: trusted_success
        if: >-
          steps.candidate.outputs.inactive != 'true' &&
          steps.validation.outcome == 'success' &&
          (steps.validation.outputs.lane != 'maintain' || steps.reservation.outcome == 'success')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.candidate.outputs.pr }}
          HEAD: ${{ steps.candidate.outputs.head }}
          CHECK_ID: ${{ steps.candidate.outputs.check_id }}
        run: |
          set -euo pipefail
          [[ "$CHECK_ID" =~ ^[1-9][0-9]*$ ]] && [[ "$HEAD" =~ ^[a-f0-9]{40}$ ]] || { echo "Exact-head merge gate identity is invalid."; exit 1; }
          CURRENT=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')
          [ "$CURRENT" = "$HEAD" ] || { echo "PR head changed before trusted success."; exit 1; }
          gh api "repos/$REPO/check-runs/$CHECK_ID" > /tmp/trusted-check.json
          jq -e --argjson id "$CHECK_ID" --arg head "$HEAD" '.id == $id and .head_sha == $head and .name == "merge-and-award" and .app.id == 15368 and .status == "in_progress"' /tmp/trusted-check.json >/dev/null
          COMPLETED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh api --method PATCH "repos/$REPO/check-runs/$CHECK_ID" -f status="completed" -f conclusion="success" -f completed_at="$COMPLETED_AT" -f 'output[title]=Trusted merge gate passed' -f 'output[summary]=Exact-head reviewer, catalog scope, required checks, and reservation gates passed.' > /tmp/trusted-success.json
          jq -e --argjson id "$CHECK_ID" --arg head "$HEAD" '.id == $id and .head_sha == $head and .name == "merge-and-award" and .app.id == 15368 and .status == "completed" and .conclusion == "success"' /tmp/trusted-success.json >/dev/null

      - name: Publish retryable wait and redispatch
        id: retry_wait
        if: >-
          always() && steps.candidate.outputs.inactive != 'true' &&
          steps.candidate.outputs.check_id != '' &&
          (steps.validation.outputs.retryable == 'true' || steps.reservation.outputs.retryable == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.candidate.outputs.pr }}
          HEAD: ${{ steps.candidate.outputs.head }}
          CHECK_ID: ${{ steps.candidate.outputs.check_id }}
          ATTEMPT: ${{ github.event_name == 'workflow_dispatch' && inputs.attempt || '1' }}
        run: |
          set -euo pipefail
          [[ "$ATTEMPT" =~ ^[1-3]$ ]] || ATTEMPT=1
          COMPLETED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh api --method PATCH "repos/$REPO/check-runs/$CHECK_ID" -f status="completed" -f conclusion="cancelled" -f completed_at="$COMPLETED_AT" -f 'output[title]=Waiting on transient infrastructure' -f 'output[summary]=No critic rejection occurred. A bounded local gate retry will run automatically.' >/dev/null
          if [ "$ATTEMPT" -lt 3 ]; then
            NEXT=$((ATTEMPT + 1))
            sleep $((ATTEMPT * 15))
            gh workflow run auto-merge-tiny.yml --repo "$REPO" -f action=merge -f pr="$PR" -f attempt="$NEXT"
            echo "Scheduled bounded retry $NEXT/3 for PR #$PR at exact head $HEAD."
          else
            echo "Bounded immediate retries exhausted without critic rejection; the next exact-head PR-quality event may retry."
          fi

      - name: Publish failed exact-head merge gate
        if: >-
          always() && steps.candidate.outputs.inactive != 'true' &&
          steps.candidate.outputs.check_id != '' &&
          steps.trusted_success.outcome != 'success' &&
          steps.retry_wait.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD: ${{ steps.candidate.outputs.head }}
          CHECK_ID: ${{ steps.candidate.outputs.check_id }}
        run: |
          set -euo pipefail
          [[ "$CHECK_ID" =~ ^[1-9][0-9]*$ ]] && [[ "$HEAD" =~ ^[a-f0-9]{40}$ ]] || { echo "Exact-head merge gate failure identity is invalid."; exit 1; }
          gh api "repos/$REPO/check-runs/$CHECK_ID" > /tmp/trusted-check.json
          jq -e --argjson id "$CHECK_ID" --arg head "$HEAD" '.id == $id and .head_sha == $head and .name == "merge-and-award" and .app.id == 15368' /tmp/trusted-check.json >/dev/null
          COMPLETED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh api --method PATCH "repos/$REPO/check-runs/$CHECK_ID" -f status="completed" -f conclusion="failure" -f completed_at="$COMPLETED_AT" -f 'output[title]=Trusted merge gate blocked' -f 'output[summary]=A fail-closed policy gate or bounded retryable upstream wait blocked this exact head. Read the machine-readable code in the job log; this is not a critic rejection unless it reports a CRITIC_* code.' > /tmp/trusted-failure.json
          jq -e --argjson id "$CHECK_ID" --arg head "$HEAD" '.id == $id and .head_sha == $head and .name == "merge-and-award" and .app.id == 15368 and .status == "completed" and .conclusion == "failure"' /tmp/trusted-failure.json >/dev/null

      - name: Merge the exact eligible head
        id: merge
        if: steps.trusted_success.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.candidate.outputs.pr }}
          HEAD: ${{ steps.candidate.outputs.head }}
        run: |
          set -euo pipefail
          observe_exact_merge() {
            gh api "repos/$REPO/pulls/$PR" > /tmp/merged.json
            jq -e --arg head "$HEAD" '.merged == true and .head.sha == $head and (.merge_commit_sha | test("^[a-f0-9]{40}$"))' /tmp/merged.json >/dev/null
          }
          CURRENT=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')
          [ "$CURRENT" = "$HEAD" ] || { echo "PR head changed after trusted validation."; exit 1; }
          if observe_exact_merge; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! gh pr merge "$PR" --repo "$REPO" --squash --delete-branch --match-head-commit "$HEAD" --auto; then
            observe_exact_merge || { echo "Exact-head auto-merge request failed before the PR merged."; exit 1; }
            echo "merged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for attempt in {1..20}; do
            if observe_exact_merge; then
              echo "merged=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 3
          done
          echo "merged=false" >> "$GITHUB_OUTPUT"
          echo "Exact-head auto-merge is enabled; durable reconciliation will finalize a maintenance award after GitHub completes the merge."

      - name: Finalize the reserved maintain award
        if: steps.merge.outcome == 'success' && steps.validation.outputs.lane == 'maintain'
        continue-on-error: true
        env:
          AWARD_SECRET: ${{ secrets.AWARD_SECRET }}
          API: https://grokplace.projectbarnlab.workers.dev
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.candidate.outputs.pr }}
          HEAD: ${{ steps.candidate.outputs.head }}
          AUTHOR: ${{ steps.candidate.outputs.author }}
        run: |
          set -euo pipefail
          [ "${{ steps.merge.outputs.merged }}" = "true" ] || {
            echo "Auto-merge is still pending; reconciliation will finalize this maintenance award after the merge."
            exit 0
          }
          MERGE_SHA=$(gh api "repos/$REPO/pulls/$PR" --jq '.merge_commit_sha')
          BODY=$(jq -n --arg github "$AUTHOR" --argjson pr "$PR" --arg head "$HEAD" --arg merge "$MERGE_SHA" '{phase:"finalize",github:$github,prNumber:$pr,headSha:$head,mergeSha:$merge}')
          if ! curl --retry 10 --retry-max-time 120 --retry-all-errors --fail-with-body -sS -X POST "$API/v1/maintain/award" -H "Authorization: Bearer $AWARD_SECRET" -H "Content-Type: application/json" -d "$BODY" -o /tmp/award.json; then
            echo "WAIT_RETRYABLE_AWARD_FINALIZE: bounded idempotent finalization retry exhausted."
            exit 75
          fi
          jq -e '.ok == true and (.awarded == 10 or .already == true)' /tmp/award.json >/dev/null

  reconcile-reservations:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.action == 'reconcile')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Reconcile durable reservations
        continue-on-error: true
        env:
          AWARD_SECRET: ${{ secrets.AWARD_SECRET }}
          API: https://grokplace.projectbarnlab.workers.dev
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ONLY_PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          [ -n "${AWARD_SECRET:-}" ] || { echo "AWARD_SECRET is not configured."; exit 1; }
          [ "${ONLY_PR:-}" != "all" ] || ONLY_PR=""
          CURSOR=""
          PAGES=0
          MAX_RECONCILE_PAGES=20
          while :; do
            PAGES=$((PAGES + 1))
            [ "$PAGES" -le "$MAX_RECONCILE_PAGES" ] || {
              echo "WAIT_RETRYABLE_RECONCILE_PAGE_CAP: stopped after $MAX_RECONCILE_PAGES pages; the next scheduled bounded reconciliation will continue."
              exit 0
            }
            if [ -n "$CURSOR" ]; then
              curl --retry 5 --retry-max-time 75 --retry-all-errors --fail-with-body -sS --get "$API/v1/maintain/reservations" --data-urlencode "cursor=$CURSOR" -H "Authorization: Bearer $AWARD_SECRET" -o /tmp/reservations.json
            else
              curl --retry 5 --retry-max-time 75 --retry-all-errors --fail-with-body -sS "$API/v1/maintain/reservations" -H "Authorization: Bearer $AWARD_SECRET" -o /tmp/reservations.json
            fi
            jq -c '.reservations[]' /tmp/reservations.json | while read -r RESERVATION; do
              PR=$(jq -r '.prNumber' <<<"$RESERVATION")
              [ -z "${ONLY_PR:-}" ] || [ "$PR" = "$ONLY_PR" ] || continue
              HEAD=$(jq -r '.headSha' <<<"$RESERVATION")
              AUTHOR=$(jq -r '.github' <<<"$RESERVATION")
              gh api "repos/$REPO/pulls/$PR" > /tmp/reconcile-pr.json
              CURRENT=$(jq -r '.head.sha' /tmp/reconcile-pr.json)
              STATE=$(jq -r '.state' /tmp/reconcile-pr.json)
              MERGED=$(jq -r '.merged' /tmp/reconcile-pr.json)
              if [ "$MERGED" = "true" ] && [ "$CURRENT" = "$HEAD" ]; then
                MERGE_SHA=$(jq -r '.merge_commit_sha' /tmp/reconcile-pr.json)
                BODY=$(jq -n --arg github "$AUTHOR" --argjson pr "$PR" --arg head "$HEAD" --arg merge "$MERGE_SHA" '{phase:"finalize",github:$github,prNumber:$pr,headSha:$head,mergeSha:$merge}')
                curl --retry 10 --retry-max-time 120 --retry-all-errors --fail-with-body -sS -X POST "$API/v1/maintain/award" -H "Authorization: Bearer $AWARD_SECRET" -H "Content-Type: application/json" -d "$BODY"
              elif [ "$STATE" = "closed" ] || [ "$CURRENT" != "$HEAD" ]; then
                BODY=$(jq -n --argjson pr "$PR" --arg head "$HEAD" '{phase:"cancel",prNumber:$pr,headSha:$head,reason:"closed unmerged or head changed"}')
                curl --retry 5 --retry-max-time 75 --retry-all-errors --fail-with-body -sS -X POST "$API/v1/maintain/award" -H "Authorization: Bearer $AWARD_SECRET" -H "Content-Type: application/json" -d "$BODY"
              fi
            done
            NEXT=$(jq -r '.nextCursor // empty' /tmp/reservations.json)
            [ -n "$NEXT" ] || break
            [ "$NEXT" != "$CURSOR" ] || { echo "Reservation cursor did not advance."; exit 1; }
            CURSOR="$NEXT"
          done

# Award bonus tiles when a tiny PR merges — only via AWARD_SECRET
name: Award tiles on merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  award:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Measure PR size + paths
        id: meta
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE" --depth=1 || true
          FILES=$(git diff --name-only "$BASE"..."$HEAD" | wc -l | tr -d ' ')
          STAT=$(git diff --numstat "$BASE"..."$HEAD" | awk '{a+=$1;d+=$2} END {print a+0,d+0}')
          ADD=$(echo "$STAT" | awk '{print $1}')
          DEL=$(echo "$STAT" | awk '{print $2}')
          TOTAL=$((ADD + DEL))
          PATHS=$(git diff --name-only "$BASE"..."$HEAD" | jq -R -s -c 'split("\n")|map(select(length>0))')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "paths=$PATHS" >> "$GITHUB_OUTPUT"
          echo "author=${{ github.event.pull_request.user.login }}" >> "$GITHUB_OUTPUT"

      - name: Require adversarial SHIP on PR body + maintain shape
        env:
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.merge_commit_sha }}
          HEAD_FOR_REVIEW: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          set +e
          node scripts/maintain-preflight.mjs --base "$BASE" --head "$HEAD"
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "Not maintain-shaped — no tile award."
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            echo "Preflight failed — no award."
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s' "$BODY" > /tmp/pr-body.md
          # Bind to the PR head that was reviewed (not only merge commit)
          if ! HEAD_SHA="$HEAD_FOR_REVIEW" node scripts/adversarial-review-check.mjs --body-file /tmp/pr-body.md --head-sha "$HEAD_FOR_REVIEW"; then
            echo "Adversarial gate failed on merge — no award."
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_ENV"

      - name: Call award API
        if: env.skip != 'true'
        env:
          AWARD_SECRET: ${{ secrets.AWARD_SECRET }}
          API: https://grokplace.barnlabs.net
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          FILES: ${{ steps.meta.outputs.files }}
          TOTAL: ${{ steps.meta.outputs.total }}
          PATHS: ${{ steps.meta.outputs.paths }}
        run: |
          set -euo pipefail
          if [ -z "${AWARD_SECRET:-}" ]; then
            echo "AWARD_SECRET not configured — skip award."
            exit 0
          fi
          if [ "$TOTAL" -gt 40 ] || [ "$FILES" -gt 3 ]; then
            echo "PR too large for award."
            exit 0
          fi
          BODY=$(jq -n \
            --arg github "$AUTHOR" \
            --argjson pr "$PR" \
            --arg sha "$SHA" \
            --argjson files "$FILES" \
            --argjson lines "$TOTAL" \
            --argjson paths "$PATHS" \
            '{github:$github, prNumber:$pr, sha:$sha, filesChanged:$files, linesChanged:$lines, paths:$paths}')
          curl -sS -X POST "$API/v1/maintain/award" \
            -H "Authorization: Bearer $AWARD_SECRET" \
            -H "Content-Type: application/json" \
            -d "$BODY" | tee /tmp/award.json
          jq -e '.ok == true' /tmp/award.json || {
            echo "Award rejected (not maintainer, path policy, or identity)."
            exit 0
          }

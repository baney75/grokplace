<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 56" fill="none" role="img" aria-label="grok/place">
  <!-- Transparent background · brand wordmark -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <!-- Pixel tile mark -->
  <g transform="translate(2,10)">
    <rect x="0" y="0" width="12" height="12" fill="url(#g)" rx="1.5"/>
    <rect x="14" y="0" width="12" height="12" fill="#e2e8f0" opacity="0.92" rx="1.5"/>
    <rect x="0" y="14" width="12" height="12" fill="#94a3b8" opacity="0.85" rx="1.5"/>
    <rect x="14" y="14" width="12" height="12" fill="url(#g)" opacity="0.75" rx="1.5"/>
  </g>
  <!-- Wordmark: grok/place -->
  <text x="42" y="38" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" letter-spacing="-0.03em">
    <tspan fill="url(#g)">grok</tspan><tspan fill="#64748b" font-weight="500">/</tspan><tspan fill="#f1f5f9">place</tspan>
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 48" fill="none" role="img" aria-label="grok/place">
  <!-- Transparent professional wordmark -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <!-- 2×2 pixel mark -->
  <g transform="translate(1,9)">
    <rect width="11" height="11" rx="1.5" fill="url(#g)"/>
    <rect x="13" width="11" height="11" rx="1.5" fill="#e2e8f0" opacity="0.9"/>
    <rect y="13" width="11" height="11" rx="1.5" fill="#94a3b8" opacity="0.75"/>
    <rect x="13" y="13" width="11" height="11" rx="1.5" fill="url(#g)" opacity="0.7"/>
  </g>
  <text x="38" y="32"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="24" font-weight="700" letter-spacing="-0.04em">
    <tspan fill="url(#g)">grok</tspan><tspan fill="#64748b" font-weight="500">/</tspan><tspan fill="#f8fafc">place</tspan>
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="grok/place">
  <!-- Solid dark tile so it reads in browser tabs -->
  <rect width="32" height="32" rx="7" fill="#0a0c10"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <!-- 2×2 pixel brand mark -->
  <rect x="6" y="6" width="9" height="9" rx="1.5" fill="url(#g)"/>
  <rect x="17" y="6" width="9" height="9" rx="1.5" fill="#e2e8f0"/>
  <rect x="6" y="17" width="9" height="9" rx="1.5" fill="#94a3b8"/>
  <rect x="17" y="17" width="9" height="9" rx="1.5" fill="url(#g)" opacity="0.85"/>
</svg>
